}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

  text-decoration: none;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h3,
h4,
h5,
h6,

}

h3,
h4,
h5,

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

}

}

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

}

.table .text-nowrap {

}

  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );

    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;

  &lt;script&gt;
    (() =&gt; {

      const polaroidTrack = root.querySelector(&#x27;[data-rq-polaroid-track]&#x27;);

      const polaroidIndex = root.querySelector(&#x27;[data-rq-polaroid-index]&#x27;);
      let polaroidLoopWidth = 0;
      let polaroidCount = 0;
      let activeProjectId = &#x27;&#x27;;
      let activeProjectCard = null;
      let activeUpdateFrame = 0;

        flying.style.height = `${from.height}px`;
        root.appendChild(flying);
        const scaleX = to.width / from.width;
        const scaleY = to.height / from.height;
        const travelX = to.left - from.left;
        const travelY = to.top - from.top;
        const flight = flying.animate([
          { offset: 0, transform: &#x27;translate3d(0,0,0) rotate(-1deg) scale(1)&#x27;, opacity: .98, filter: &#x27;blur(0px)&#x27; },

          { offset: .86, transform: `translate3d(${travelX * .94}px,${travelY - 12}px,0) rotate(-.7deg) scale(${scaleX * 1.08},${scaleY * 1.08})`, opacity: .92, filter: &#x27;blur(0px)&#x27; },
          { offset: 1, transform: `translate3d(${travelX}px,${travelY}px,0) rotate(0deg) scale(${scaleX},${scaleY})`, opacity: 1, filter: &#x27;blur(0px)&#x27; }

          flying.remove();
          target.classList.remove(&#x27;is-receiving&#x27;);
        });
      };
      const addViewedProject = (projectId, sourceCard) =&gt; {

        if (!target) {

          target = document.createElement(&#x27;button&#x27;);
          target.type = &#x27;button&#x27;;
          target.className = &#x27;rq-index-item&#x27;;
          target.classList.add(&#x27;is-receiving&#x27;);
          target.dataset.projectLink = projectId;
          target.dataset.number = String(projectNumber).padStart(2, &#x27;0&#x27;);
          target.setAttribute(&#x27;aria-label&#x27;, `Return to ${title}`);
          target.addEventListener(&#x27;click&#x27;, () =&gt; {
            const middleCard = polaroidTrack.querySelector(`.rq-polaroid[data-project-id=&quot;${projectId}&quot;]:not([aria-hidden=&quot;true&quot;])`);
            if (!middleCard) return;
            const targetLeft = middleCard.offsetLeft - (polaroidStage.clientWidth - middleCard.offsetWidth) / 2;
            polaroidTrack.scrollTo({ left: targetLeft, behavior: reduceMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
          });
          polaroidIndex.appendChild(target);
          animateCardToIndex(sourceCard, target);
        }
      };
      const updateActiveProject = (animatePrevious = true) =&gt; {
        activeUpdateFrame = 0;
        const closest = closestCardToStageCenter();
        const nextId = closest?.dataset.projectId || &#x27;&#x27;;
        if (!nextId || nextId === activeProjectId) return;
        if (activeProjectId &amp;&amp; animatePrevious) addViewedProject(activeProjectId, activeProjectCard);
        activeProjectId = nextId;
        activeProjectCard = closest;
        polaroidIndex?.querySelectorAll(&#x27;.rq-index-item&#x27;).forEach((item) =&gt; {
          item.setAttribute(&#x27;aria-current&#x27;, String(item.dataset.projectLink === activeProjectId));
        });
      };
      const scheduleActiveUpdate = () =&gt; {
        if (activeUpdateFrame) return;
        activeUpdateFrame = window.requestAnimationFrame(() =&gt; updateActiveProject(true));
      };
      if (polaroidTrack &amp;&amp; polaroidTrack.dataset.loopReady !== &#x27;true&#x27;) {
        const originals = Array.from(polaroidTrack.children);
        polaroidCount = originals.length;
        const before = document.createDocumentFragment();
        const after = document.createDocumentFragment();
        originals.forEach((card, index) =&gt; {
          card.dataset.projectId = String(index);
          const leadingClone = card.cloneNode(true);
          const trailingClone = card.cloneNode(true);
          leadingClone.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          trailingClone.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);

          after.appendChild(trailingClone);

      if (polaroidTrack) {

          isDragging = false;

        polaroidTrack.addEventListener(&#x27;pointerup&#x27;, stopDragging);
        polaroidTrack.addEventListener(&#x27;pointercancel&#x27;, stopDragging);
        polaroidTrack.addEventListener(&#x27;scroll&#x27;, () =&gt; {
          if (!isDragging &amp;&amp; !embodiedStackPlaying) normalizePolaroidLoop();
          scheduleActiveUpdate();
        });
      }
      if (polaroidStage &amp;&amp; polaroidTrack) {
        polaroidStage.addEventListener(&#x27;wheel&#x27;, (event) =&gt; {

          event.stopPropagation();
          if (!delta || wheelLocked) return;

          const firstCard = polaroidTrack.querySelector(&#x27;.rq-polaroid&#x27;);
          const gap = parseFloat(window.getComputedStyle(polaroidTrack).columnGap) || 0;
          const cardSpan = (firstCard?.getBoundingClientRect().width || 240) + gap;
          polaroidTrack.scrollBy({ left: -Math.sign(delta) * cardSpan, behavior: reduceMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
          window.setTimeout(() =&gt; {
            normalizePolaroidLoop();
            wheelLocked = false;
          }, reduceMotion ? 80 : 720);
        }, { passive: false });
      }
      const scrollIndex = root.querySelector(&#x27;[data-rq-scroll-index]&#x27;);
      const scrollIndexList = root.querySelector(&#x27;[data-rq-scroll-index-list]&#x27;);
      const scrollIndexToggle = root.querySelector(&#x27;[data-rq-index-toggle]&#x27;);
      const scrollStack = root.querySelector(&#x27;[data-rq-scroll-stack]&#x27;);
      const scrollStackCount = root.querySelector(&#x27;[data-rq-stack-count]&#x27;);
      const scrollStackTitle = root.querySelector(&#x27;.rq-stack-title&#x27;);
      const homePanel = root.querySelector(&#x27;[data-rq-panel=&quot;home&quot;]&#x27;);
      const embodiedSection = root.querySelector(&#x27;#rq-featured&#x27;);
      const queuedNavigationIds = new Set();
      let embodiedNavigationQueued = false;
      let embodiedStackPlaying = false;
      let embodiedStackComplete = false;
      let embodiedReversePlaying = false;
      let embodiedScrollProgress = 0;
      let embodiedStartScroll = 0;
      let embodiedTargetScroll = 0;
      let embodiedCurrentScroll = 0;
      let embodiedMotionFrame = 0;
      let scrollNavigationFrame = 0;
      let railExpandedGroupIndex = -1;
      const embodiedNavigationProjects = [
        { id: &#x27;gesture-interaction&#x27;, title: &#x27;Gesture Interaction&#x27;, target: embodiedSection },
        { id: &#x27;imu-glove&#x27;, title: &#x27;IMU Glove&#x27;, target: embodiedSection },
        { id: &#x27;emg-armband&#x27;, title: &#x27;EMG Armband&#x27;, target: embodiedSection },
        { id: &#x27;plant-bot&#x27;, title: &#x27;Plant Bot&#x27;, target: embodiedSection },

      const laterNavigationProjects = Array.from(root.querySelectorAll(&#x27;.rq-vr-item, .rq-evidence-projects .rq-project, .rq-playground .rq-project&#x27;)).map((element, index) =&gt; {
        const title = element.querySelector(&#x27;h3&#x27;)?.textContent?.trim() || `Project ${index + 6}`;
        const id = `rq-project-${index + 6}`;

      });
      const xrSection = root.querySelector(&#x27;.rq-vr-grid&#x27;)?.closest(&#x27;.rq-section&#x27;);

      const projectsInSection = (section) =&gt; laterNavigationProjects.filter((project) =&gt; project.target.closest(&#x27;.rq-section&#x27;) === section);
      const navigationGroups = [
        { title: &#x27;Body as Interface&#x27;, section: embodiedSection, projects: embodiedNavigationProjects },
        { title: &#x27;XR Experiences&#x27;, section: xrSection, projects: projectsInSection(xrSection) },
        { title: &#x27;Test &amp; Rebuild&#x27;, section: evidenceSection, projects: projectsInSection(evidenceSection) },
        { title: &#x27;Playground&#x27;, section: playgroundSection, projects: projectsInSection(playgroundSection) }
      ].filter((group) =&gt; group.section);
      const updateScrollStack = () =&gt; {
        const archivedGroups = navigationGroups.slice(0, Math.max(0, railExpandedGroupIndex));
        const count = archivedGroups.reduce((total, group) =&gt; total + group.projects.length, 0);
        if (scrollStack) scrollStack.dataset.visible = String(archivedGroups.length &gt; 0);
        if (scrollStackCount) scrollStackCount.textContent = String(count).padStart(2, &#x27;0&#x27;);
        if (scrollStackTitle) scrollStackTitle.innerHTML = archivedGroups.length === 1 ? archivedGroups[0].title.replace(&#x27; &#x27;, &#x27;&lt;br&gt;&#x27;) : &#x27;Earlier&lt;br&gt;Work&#x27;;
      };
      const createRailThumbnail = (project, arrived = false) =&gt; {
        if (!scrollIndexList || !project.target) return null;
